version: 2

models:
  - name: base_table
    description: "Minimal base table used by test_semantic_view."

  - name: test_semantic_view
    description: "Minimal semantic view referenced via ref() in cortex_agent_test."

  - name: cortex_agent_test
    description: "Comprehensive agent exercising every config and spec option — comment, profile, alias, tags, orchestration budget, all instruction fields, both tool types with full input_schema, tool_resources, and grants."
    config:
      alias: cortex_agent_test
      comment: 'Full integration test agent — exercises every config and spec option'
      profile: '{"display_name": "Full Test Agent", "avatar": "robot", "color": "blue"}'
      tags: ['integration']
      agent_grants: ['dbt_demo_role']

  - name: mcp_server_test
    description: "Comprehensive MCP server exercising all three tool types — Cortex Search (via var), Cortex Analyst (via ref to test_semantic_view), and SQL execution."
    config:
      alias: mcp_server_test
      tags: ['integration']

  - name: cortex_agent_versioned_test_versions
    description: "Captures SHOW VERSIONS IN AGENT output for cortex_agent_versioned_test so singular tests can assert on committed version count."

  - name: mcp_server_test_describe
    description: "Captures DESCRIBE MCP SERVER output for mcp_server_test so singular tests can assert on the spec (GET_DDL does not support MCP servers)."
