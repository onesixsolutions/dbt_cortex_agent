name: Integration Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  integration-tests:
    name: integration-tests (${{ matrix.dbt.name }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      # Both engines deploy the same objects into the same Snowflake test schema,
      # so the jobs must not run at the same time.
      max-parallel: 1
      matrix:
        dbt:
          - name: dbt v1
            package: dbt-snowflake
          - name: dbt v2
            package: dbt

    env:
      SNOWFLAKE_TEST_ACCOUNT: ${{ secrets.SNOWFLAKE_TEST_ACCOUNT }}
      SNOWFLAKE_TEST_USER: ${{ secrets.SNOWFLAKE_TEST_USER }}
      SNOWFLAKE_TEST_AUTHENTICATOR: snowflake_jwt
      SNOWFLAKE_TEST_PRIVATE_KEY_PATH: /tmp/snowflake_private_key.p8
      SNOWFLAKE_TEST_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_TEST_PRIVATE_KEY_PASSPHRASE }}
      SNOWFLAKE_TEST_ROLE: ${{ secrets.SNOWFLAKE_TEST_ROLE }}
      SNOWFLAKE_TEST_DATABASE: ${{ secrets.SNOWFLAKE_TEST_DATABASE }}
      SNOWFLAKE_TEST_WAREHOUSE: ${{ secrets.SNOWFLAKE_TEST_WAREHOUSE }}
      SNOWFLAKE_TEST_SCHEMA: ${{ secrets.SNOWFLAKE_TEST_SCHEMA }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ${{ matrix.dbt.name }}
        run: pip install ${{ matrix.dbt.package }}

      - name: Print dbt version
        run: dbt --version

      - name: Write private key file
        run: |
          printf '%s' "$SNOWFLAKE_PRIVATE_KEY" > /tmp/snowflake_private_key.p8
          chmod 600 /tmp/snowflake_private_key.p8
        env:
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_TEST_PRIVATE_KEY }}

      - name: Run dbt deps
        working-directory: integration_tests
        run: dbt deps

      - name: Run dbt models
        working-directory: integration_tests
        run: dbt run

      # A second run against the objects the first run just created. This is what exercises
      # the paths a first run never reaches: ALTER CORTEX SEARCH SERVICE, committing a second
      # agent version, and COPY GRANTS on CREATE OR REPLACE AGENT. The second_run var lets
      # models and tests tell the two runs apart.
      - name: Run dbt models again (second-run paths)
        working-directory: integration_tests
        run: "dbt run --vars '{second_run: true}'"

      - name: Print compiled and run SQL on failure
        if: failure()
        run: |
          echo "=== Compiled cortex_agent_test.sql ==="
          cat integration_tests/target/compiled/dbt_cortex_agent_integration_tests/models/cortex_agent_test.sql || echo "(file not found)"
          echo "=== Run cortex_agent_test.sql ==="
          cat integration_tests/target/run/dbt_cortex_agent_integration_tests/models/cortex_agent_test.sql || echo "(file not found)"

      - name: Run dbt tests
        working-directory: integration_tests
        run: "dbt test --vars '{second_run: true}'"
